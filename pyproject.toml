[project]
name = "llm-document-intelligence"
version = "0.1.0"
description = "Sentiment classification, structured extraction and retrieval-augmented QA over financial documents with open-weight LLMs, evaluated against public ground truth."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "accelerate",
    "beautifulsoup4",
    "bm25s",
    "httpx",
    "huggingface-hub",
    "lxml",
    "matplotlib",
    "numpy",
    "pandas",
    "ppi-python>=0.2.3",
    "pyarrow",
    "pydantic>=2.13",
    "pypdf",
    "pyyaml",
    "rapidfuzz",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "statsmodels",
    "transformers",
]

[dependency-groups]
dev = ["ruff"]
serve = ["fastapi", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
